# ═══════════════════════════════════════════════════════════════════════════
# 命令策略 · 出厂规则（不是你的配置！）
#
# 你的改动记在 <数据目录>/policy.yaml（只有 rules 和 readOnlyRemove 两个键），
# 出厂规则随应用升级自动跟随，不需要手动合并或重置。
# ═══════════════════════════════════════════════════════════════════════════
#
# 判定顺序：
#   1. 灾难级操作（代码里的硬底线）              → 拒绝，任何规则都放不通
#   2. deny 规则（任意来源）                     → 拒绝
#   3. 路径规则（你的 → 出厂的）                 → allow / ask
#   4. 命令规则（你的 → 出厂的）                 → allow / ask
#   5. 默认动作：只读档 = 名单命中即放行，否则拒绝；工作档 = 执行
#   6. 工作档：路径型动作（rm/mv/cp/mkdir/Set-Content…）目标不在可写根内 → 询问
#
# 条目语法：
#   命令规则 = 命令前缀，末尾 * 表示"其后任意"    例如 "ssh *"
#   路径规则 = 路径 glob（~ 与 %VAR% 会展开）      例如 "~/.ssh/**"
# ═══════════════════════════════════════════════════════════════════════════

