ask:
  # 必问项（命令规则，action=ask）：不可逆 / 跨机器的动作，执行前问你一次。
  - "ssh *"
  - "scp *"
  - "sftp *"
  - "rsync *"
  - "plink *"
  - "Invoke-Command *"
  - "Enter-PSSession *"
  - "New-PSSession *"
  - "git push *"
  - "git reset --hard *"
  - "git clean -f *"
  - "git clean -fd *"
  - "git clean -x *"
  - "npm publish *"
  - "npm unpublish *"
  - "pnpm publish *"
  - "yarn publish *"
  - "bun publish *"
  - "docker rm *"
  - "docker rmi *"
  - "docker system prune *"
  - "kubectl delete *"
  - "taskkill *"
  - "Stop-Process *"
  - "Stop-Service *"
  - "Restart-Service *"

sensitive:
  # 敏感路径（路径规则，action=ask）：读写这些文件先问你一次（只读档直接拒绝）。
  - "~/.ssh/**"
  - "~/.gnupg/**"
  - "~/.aws/**"
  - "~/.kube/**"
  - "~/.docker/config.json"
  - "~/.npmrc"
  - "~/.netrc"
  - "~/.git-credentials"
  - "~/.pypirc"
  - "~/.guada/secret.key"
  - "**/id_rsa"
  - "**/id_ed25519"
  - "**/*.pem"
  - "**/*.p12"
  - "**/*.pfx"
  - "**/Cookies"
  - "**/Login Data"
  - "**/.env"
  - "**/.env.*"

writeRoots:
  # 可写根（路径规则，action=allow）：工作区之外仍然放行的目录（包管理器 / 构建缓存）。
  - "%LOCALAPPDATA%/npm-cache"
  - "%LOCALAPPDATA%/pnpm"
  - "%LOCALAPPDATA%/Yarn"
  - "%APPDATA%/npm"
  - "~/.npm"
  - "~/.yarn"
  - "~/.bun"
  - "~/.nvm"
  - "~/.local/share/pnpm"
  - "%LOCALAPPDATA%/pip"
  - "%LOCALAPPDATA%/conda"
  - "%LOCALAPPDATA%/uv"
