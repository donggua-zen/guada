# 阿里云百炼 类型目录（bundled 预置，随应用版本分发）
# 此文件是「可添加供应商」模板与模型目录的权威数据；
# 实例文件按 modelName 条目级继承并覆盖，目录更新自动流到未覆盖的实例
# 阿里云推出的大模型服务平台，提供通义千问等自研模型及第三方模型接入。
# API Key 获取: https://bailian.console.aliyun.com/cn-beijing?tab=model#/api-key
type: aliyun-bailian
name: 阿里云百炼
description: 阿里云推出的大模型服务平台，提供通义千问等自研模型及第三方模型接入。
apiKeyUrl: https://bailian.console.aliyun.com/cn-beijing?tab=model#/api-key
avatarUrl: aliyun-bailian.svg
protocol: openai
defaultApiUrl: https://dashscope.aliyuncs.com/compatible-mode/v1/
compat:
  thinkingFormat: qwen
models:
  - modelName: qwen3.6-plus
    supportsThinking: true
    thinkingEfforts: [none, on]
    modelType: text
    config:
      inputCapabilities:
        - text
        - image
      outputCapabilities:
        - text
      features:
        - tools
      contextWindow: 1000000
