# 智谱 AI 类型目录（bundled 预置，随应用版本分发）
# 此文件是「可添加供应商」模板与模型目录的权威数据；
# 实例文件按 modelName 条目级继承并覆盖，目录更新自动流到未覆盖的实例
# 源自清华技术背景，提供 GLM 系列大语言模型，支持强大的推理与代码能力。
# API Key 获取: https://open.bigmodel.cn/usercenter/apikeys
type: zhipu
name: 智谱 AI
description: 源自清华技术背景，提供 GLM 系列大语言模型，支持强大的推理与代码能力。
apiKeyUrl: https://open.bigmodel.cn/usercenter/apikeys
avatarUrl: zhipu.svg
protocol: openai
defaultApiUrl: https://open.bigmodel.cn/api/paas/v4/
compat:
  thinkingFormat: zai
models:
  - modelName: GLM-5
    supportsThinking: true
    thinkingEfforts: [none, on]
    modelType: text
    config:
      inputCapabilities:
        - text
      outputCapabilities:
        - text
      features:
        - tools
      contextWindow: 200000
      maxOutputTokens: 128000
