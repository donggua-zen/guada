# XQAPI 类型目录（bundled 预置，随应用版本分发）
# 此文件是「可添加供应商」模板与模型目录的权威数据；
# 实例文件按 modelName 条目级继承并覆盖，目录更新自动流到未覆盖的实例
# 新一代统一 AI API 平台，一个接口调用全部模型。
# API Key 获取: https://xqapi.com/user/login?invite=6542C98ACD
type: xqapi
name: XQAPI
description: 新一代统一 AI API 平台，一个接口调用全部模型。
apiKeyUrl: https://xqapi.com/user/login?invite=6542C98ACD
avatarUrl: xqapi.svg
protocol: openai
defaultApiUrl: https://xqapi.com/v1/
models:
  - modelName: gpt-5.4
    modelType: text
    thinkingEfforts:
      - none
      - low
      - medium
      - high
    config:
      inputCapabilities:
        - text
        - image
      outputCapabilities:
        - text
      features:
        - tools
      contextWindow: 1100000
      maxOutputTokens: 128000
    supportsThinking: true
