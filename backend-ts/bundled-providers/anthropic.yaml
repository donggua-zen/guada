# Anthropic 类型目录（bundled 预置，随应用版本分发）
# 此文件是「可添加供应商」模板与模型目录的权威数据；
# 实例文件按 modelName 条目级继承并覆盖，目录更新自动流到未覆盖的实例
# Anthropic 的 Claude 系列模型，以安全和高质量对话著称。
# API Key 获取: https://console.anthropic.com/settings/keys
type: anthropic
name: Anthropic
description: Anthropic 的 Claude 系列模型，以安全和高质量对话著称。
apiKeyUrl: https://console.anthropic.com/settings/keys
avatarUrl: anthropic.svg
protocol: anthropic
defaultApiUrl: https://api.anthropic.com
models:
  - modelName: claude-fable-5
    supportsThinking: false
    modelType: text
    config:
      inputCapabilities:
        - text
      outputCapabilities:
        - text
      features:
        - tools
      contextWindow: 1000000
      maxOutputTokens: 128000
  - modelName: claude-mythos-5
    supportsThinking: false
    modelType: text
    config:
      inputCapabilities:
        - text
      outputCapabilities:
        - text
      features:
        - tools
      contextWindow: 1000000
      maxOutputTokens: 128000
  - modelName: claude-opus-4-8
    supportsThinking: false
    modelType: text
    config:
      inputCapabilities:
        - text
      outputCapabilities:
        - text
      features:
        - tools
      contextWindow: 1000000
      maxOutputTokens: 128000
  - modelName: claude-sonnet-4-6
    supportsThinking: false
    modelType: text
    config:
      inputCapabilities:
        - text
      outputCapabilities:
        - text
      features:
        - tools
      contextWindow: 1000000
      maxOutputTokens: 66000
  - modelName: claude-haiku-4-5
    supportsThinking: false
    modelType: text
    config:
      inputCapabilities:
        - text
      outputCapabilities:
        - text
      features:
        - tools
      contextWindow: 200000
      maxOutputTokens: 66000
