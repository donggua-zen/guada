# 冒烟任务 01：产出指定交付物
# 目的：用最小成本验证「agent 能否按要求把交付物写到指定路径」。
# 速度：基础镜像已缓存 → 构建秒级；任务本身一步完成 → 端到端分钟级。
version = "1.0"

artifacts = ["/app/output/result.txt"]

[metadata]
author_name = "GuaDa Eval"
category = "smoke"
tags = ["smoke", "deliverable", "file-write"]
difficulty_explanation = "写一个两行文件到指定路径"

[verifier]
timeout_sec = 60.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
gpus = 0

[agent]
# 冒烟任务给 5 分钟足够；这也是"快速重测"的关键——失败得快，信号来得快
timeout_sec = 300.0

[environment]
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
gpus = 0
