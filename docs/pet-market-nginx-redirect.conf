    # 桌宠市场索引：官网只做 302（几十字节，不占 3M 带宽），大文件走腾讯 COS。
    # UPSTREAM_URL 由 scripts/deploy-market.sh 上传新索引后自动 sed 替换。
    # 官网保留 index-full.json 作为完整备份。
    location = /petdex/index.json {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        return 302 https://workbuddy-space-static.codebuddy.work/image/1mpNPXgxsvhw0hQnlsiUod.json;
    }
