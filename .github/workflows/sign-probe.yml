name: Sign probe

# 临时诊断工作流（用完即删）：在真实 macOS runner 上跑一遍 signMacApp，
# 验证自签名路径可用 —— 1.0.3 首跑时 codesign 在 runner 上报 "no identity found"
# （根因：身份所在钥匙串不在用户搜索列表里），这是修复的回归验证。
# 触发：推送 probe-sign-* tag。
on:
  push:
    tags:
      - 'probe-sign-*'

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 用真实 handler 签名一个真实 .app
        env:
          MAC_SIGN_LINK: ${{ secrets.MAC_SIGN_LINK }}
          MAC_SIGN_PASSWORD: ${{ secrets.MAC_SIGN_PASSWORD }}
        run: |
          set -e
          work=$(mktemp -d)

          # 手工搭一个最小 .app（不依赖系统应用，避免拷贝系统包的各种限制）
          mkdir -p "$work/appout/GuaDa.app/Contents/MacOS"
          cp /bin/ls "$work/appout/GuaDa.app/Contents/MacOS/GuaDa"
          cat > "$work/appout/GuaDa.app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>GuaDa</string>
            <key>CFBundleIdentifier</key><string>com.guada.probe</string>
            <key>CFBundleName</key><string>GuaDa</string>
            <key>CFBundlePackageType</key><string>APPL</string>
          </dict></plist>
          PLIST

          cat > "$work/run-handler.cjs" <<'JS'
          const path = require('path');
          const handler = require(path.join(process.cwd(), 'scripts', 'after-pack-handler.js'));
          handler({
            electronPlatformName: 'darwin',
            appOutDir: process.env.APP_DIR,
            packager: { appInfo: { productFilename: 'GuaDa' } },
          })
            .then(() => console.log('HANDLER DONE'))
            .catch((e) => {
              console.error('HANDLER FAILED:', e);
              process.exit(1);
            });
          JS

          echo "--- 签名前 keychain 状态 ---"
          security list-keychains -d user
          security default-keychain -d user

          APP_DIR="$work/appout" node "$work/run-handler.cjs"

          echo "--- 签名后 keychain 状态（应与签名前一致：恢复逻辑生效）---"
          security list-keychains -d user
          security default-keychain -d user

          echo "--- 产物校验 ---"
          codesign -dv --verbose=2 "$work/appout/GuaDa.app" 2>&1 | head -12
          codesign --verify --deep --strict "$work/appout/GuaDa.app" && echo "VERIFY OK"
          if codesign -dv --verbose=2 "$work/appout/GuaDa.app" 2>&1 | grep -q "Authority=GuaDa Local Sign"; then
            echo "PROBE PASS: Authority=GuaDa Local Sign"
          else
            echo "PROBE FAIL: Authority 不符"
            exit 1
          fi
