# Guada Relay 类型卡（声明式供应商包）
#
# 协议复用内置 openai 适配器；requestCompression 是宿主通用传输能力：
# 大 JSON 请求体（≥64KB）gzip 压缩后发送（Content-Encoding: gzip），
# 需网关支持（llm_proxy 已支持，见 DEPLOY_NAS.md「已知坑 18」）。
# 实例 YAML 显式写 requestCompression: false 可单独关闭。
type: guada-relay
name: Guada Relay
description: 自家中转站（OpenAI 兼容），大请求自动 gzip 压缩
avatarUrl: assets/logo.svg
protocol: openai
defaultApiUrl: https://easyapi.dingd.cn/v1
requestCompression: true
models:
  - modelName: deepseek-v4.1-flash
    name: DeepSeek V4.1 Flash
    supportsThinking: true
    thinkingEfforts: [none, on]
    modelType: text
    config:
      inputCapabilities: [text, image]
      outputCapabilities: [text]
      features: [tools, vision]
      contextWindow: 131072
      maxOutputTokens: 8192
  - modelName: glm-5.3-flash
    name: GLM 5.3 Flash
    supportsThinking: true
    thinkingEfforts: [none, on]
    modelType: text
    config:
      inputCapabilities: [text, image]
      outputCapabilities: [text]
      features: [tools, vision]
      contextWindow: 131072
      maxOutputTokens: 8192
